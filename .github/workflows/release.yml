name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Module
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Xposed Hook APK
        run: |
          gradle :xposed-module:assembleRelease --stacktrace

      - name: Verify packaged Xposed entry point
        run: python3 tools/verify_apk.py xposed-module/build/outputs/apk/release/xposed-module-release.apk

      - name: Prepare Module Files and Package Flashable Zip
        run: |
          PROP_VERSION=$(grep "^version=" zygisk-module/module.prop | cut -d'=' -f2 | tr -d '\r')
          PROP_CODE=$(grep "^versionCode=" zygisk-module/module.prop | cut -d'=' -f2 | tr -d '\r')
          TAG_NAME="${PROP_VERSION:-v1.0.2}"
          ZIP_NAME="HyperOS-UI-Skipper-${TAG_NAME}.zip"
          echo "Packaging module zip as: $ZIP_NAME"

          # Locate built APK
          APK_SRC=$(find xposed-module/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            APK_SRC=$(find xposed-module/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_SRC"
          cp "$APK_SRC" xposed-module/HyperOS-UI-Skipper.apk

          # Assemble Magisk / KernelSU flashable zip
          OUT_DIR="zygisk-module/out"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          cp zygisk-module/module.prop "$OUT_DIR/"
          for script in customize.sh uninstall.sh action.sh service.sh status.sh activate.sh; do
            tr -d '\r' < "zygisk-module/$script" > "$OUT_DIR/$script"
            chmod 755 "$OUT_DIR/$script"
          done

          cp xposed-module/HyperOS-UI-Skipper.apk "$OUT_DIR/HyperOS-UI-Skipper.apk"
          cp -r zygisk-module/webroot "$OUT_DIR/webroot"

          cd "$OUT_DIR"
          zip -r9 "../$ZIP_NAME" ./*
          cd ../..

          # Update update.json automatically for KernelSU / Magisk in-app updates
          cat > update.json <<EOF
          {
            "version": "${TAG_NAME}",
            "versionCode": ${PROP_CODE:-102},
            "zipUrl": "https://github.com/Hengen42/hyperos-ui-skipper/releases/download/${TAG_NAME}/${ZIP_NAME}",
            "changelog": "https://raw.githubusercontent.com/Hengen42/hyperos-ui-skipper/main/CHANGELOG.md"
          }
          EOF

          echo "ZIP_PATH=zygisk-module/$ZIP_NAME" >> $GITHUB_ENV
          echo "TAG_TARGET=$TAG_NAME" >> $GITHUB_ENV

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          python3 -c "
          import sys, re
          tag = sys.argv[1].lstrip('v')
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()
          pattern = rf'##\s+v?{re.escape(tag)}\b(.*?)(?=\n##\s+|$)'
          m = re.search(pattern, content, re.DOTALL)
          notes = m.group(1).strip() if m else ''
          with open('release_notes.md', 'w', encoding='utf-8') as f:
              if notes:
                  f.write(notes + '\n')
              else:
                  f.write('Release ' + sys.argv[1] + '\n')
          " "${{ env.TAG_TARGET }}"
          cat release_notes.md

      - name: Update update.json in repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Auto-update update.json for release [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_TARGET }}
          name: HyperOS UI Skipper ${{ env.TAG_TARGET }}
          body_path: release_notes.md
          generate_release_notes: true
          files: |
            ${{ env.ZIP_PATH }}
